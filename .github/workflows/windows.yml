name: Windows build

# Builds the Windows installer and portable exe on GitHub's runners.
# Runs when a release is published (and attaches the exes to it), or by hand
# from the Actions tab (exes are kept as a workflow artifact).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:win
        env:
          # No code-signing certificate: build unsigned instead of searching for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: DocScan-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.exe --clobber
